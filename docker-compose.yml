services:
  postgres:
    image: postgres:16-alpine
    container_name: juegos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - prueba-carga-network
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: juegos-api
    restart: unless-stopped
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: postgres        # Nombre del servicio en Docker network
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      API_HOST: 0.0.0.0
      API_PORT: ${API_PORT}
    ports:
      - "${API_PORT}:${API_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - prueba-carga-network    

networks:
  prueba-carga-network:
    name: prueba-carga-network
  
volumes:
  postgres_data:
